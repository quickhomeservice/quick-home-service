<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Home Service - Links</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f1f5f9; padding: 50px 20px; margin: 0; }
        .card { background: #ffffff; max-width: 380px; margin: auto; padding: 35px 25px; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .logo-title { color: #0f172a; font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 15px; margin: 14px 0; border-radius: 12px; text-decoration: none; font-weight: 600; color: white; font-size: 16px; transition: transform 0.2s ease; }
        .btn:active { transform: scale(0.98); }
        .fb-btn { background-color: #1877f2; }
        .web-btn { background-color: #0f766e; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-title">Quick Home Service</div>
        <div class="subtitle">দ্রুত সমাধান, নির্ভুল কাজ – আমাদের প্রতিজ্ঞা</div>
        
        <a href="https://www.facebook.com/QuickHomeServiceBD" target="_blank" class="btn fb-btn">
            📘 ফেসবুক পেজ (Facebook Page)
        </a>
        
        <a href="https://quickhomeservice.github.io/quick-home-service/" target="_blank" class="btn web-btn">
            🌐 আমাদের ওয়েবসাইট (Website)
        </a>
    </div>
</body>
</html>
